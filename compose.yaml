services:
  transcriber:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_GPU: "false"
    ports:
      # Keep the unauthenticated upload API private to this machine.
      - "127.0.0.1:8765:8765"
    volumes:
      # Persist completed TXT/JSON/SRT files across container recreation.
      - transcription-work:/app/.work
      # Avoid redownloading Whisper models when containers are rebuilt.
      - whisper-cache:/home/app/.cache/huggingface
    restart: unless-stopped

volumes:
  transcription-work:
  whisper-cache:
